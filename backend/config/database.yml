default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  <% if ENV["DATABASE_URL"].present? %>
  url: <%= ENV["DATABASE_URL"] %>
  <% else %>
  host: <%= ENV.fetch("DB_HOST", "db") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("POSTGRES_USER", "managease") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "managease_secret") %>
  <% end %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "managease_development") %>

test:
  <<: *default
  database: managease_test

production:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "managease_production") %>
