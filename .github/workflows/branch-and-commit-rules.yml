name: Branch & Commit Conventions

on:
  push:
  pull_request:

jobs:
  validate-branch-name:
    name: Validate Branch Name
    runs-on: ubuntu-latest
    steps:
      - name: Check Branch Naming Convention
        run: |
          EVENT="${{ github.event_name }}"
          BASE="${{ github.base_ref }}"
          HEAD="${{ github.head_ref }}"
          REF="${{ github.ref_name }}"

          echo "Event: $EVENT, Base: $BASE, Head: $HEAD, Ref: $REF"

          NAMING_PATTERN="^(feature|bugfix|hotfix|docs|refactor)\/([A-Za-z0-9]+-[0-9]+|[0-9]+)-[a-z0-9-]+$"

          if [ "$EVENT" = "pull_request" ]; then
            if [ "$BASE" = "main" ]; then
              # Main branch accepts dev or hotfix/* (handled by main-merge-gate.yml as well)
              if [ "$HEAD" = "dev" ] || [[ "$HEAD" =~ ^hotfix\/ ]]; then
                echo "✅ PR to main from '$HEAD' is valid."
                exit 0
              fi
            fi

            # All PRs to dev must originate from properly named branches
            if [[ "$HEAD" =~ $NAMING_PATTERN ]]; then
              echo "✅ PR branch '$HEAD' matches naming convention."
              exit 0
            else
              echo "::error::PR branch '$HEAD' violates branch naming convention."
              echo "PR branches targeting '$BASE' must match: feature/, bugfix/, hotfix/, docs/, or refactor/<ticket>-<description>"
              exit 1
            fi
          else
            # Push events
            if [[ "$REF" =~ $NAMING_PATTERN ]] || [ "$REF" = "dev" ] || [ "$REF" = "main" ]; then
              echo "✅ Branch '$REF' is valid."
              exit 0
            else
              echo "::error::Branch '$REF' violates naming convention."
              exit 1
            fi
          fi

  validate-commit-messages:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Validate PR Commits
        if: github.event_name == 'pull_request'
        run: |
          pnpm commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Validate Push Commit
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          pnpm commitlint --last --verbose

