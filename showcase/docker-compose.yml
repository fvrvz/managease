services:
  showcase:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: managease_showcase
    restart: unless-stopped
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5174:5174"
    command: sh -c "pnpm install && pnpm dev --host --port 5174"
